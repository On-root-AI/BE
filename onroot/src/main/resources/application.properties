spring.application.name=onroot

# DB
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/OnRoot?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Q-Net API
qnet.api.key=${QNET_API_KEY}
qnet.api.base-url=http://openapi.q-net.or.kr/api/service/rest/InquiryTestInformationNTQSVC

# 국가자격 시험일정 API (data.go.kr)
qualexam.api.key=${QUALEXAM_API_KEY}
qualexam.api.base-url=https://apis.data.go.kr/B490007/qualExamSchd

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.packages-to-scan=com.OnRoot.onroot

# Gemini API
gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.api.model=gemini-2.5-flash-lite
