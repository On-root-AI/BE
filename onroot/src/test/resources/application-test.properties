# Test profile uses in-memory H2 to avoid needing local MySQL during tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA settings for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# Ensure Hibernate generates H2-compatible DDL (override any MySQL dialect from application.properties)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable external initialization that may hit network/services during tests
spring.main.allow-bean-definition-overriding=true

# Provide placeholders used by main application to avoid unresolved placeholders during tests
DB_URL=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
DB_USERNAME=sa
DB_PASSWORD=
QNET_API_KEY=
GEMINI_API_KEY=
onroot.datainit.enabled=false
